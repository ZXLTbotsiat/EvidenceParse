name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidence_parse_test
          POSTGRES_USER: evidence_parse
          POSTGRES_PASSWORD: evidence_parse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidence_parse -d evidence_parse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVIDENCE_PARSE_DATABASE_URL: postgresql+psycopg://evidence_parse:evidence_parse@127.0.0.1:5432/evidence_parse_test
      EVIDENCE_PARSE_AUTO_CREATE_SCHEMA: "false"
      EVIDENCE_PARSE_TEST_POSTGRES_URL: postgresql+psycopg://evidence_parse:evidence_parse@127.0.0.1:5432/evidence_parse_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: ruff check src tests ../../tools
      - run: pytest -q
      - name: Run synthetic benchmark
        run: python ../../tools/run_benchmark.py --output-directory "$RUNNER_TEMP/evidence-parse-benchmark"
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark
          path: ${{ runner.temp }}/evidence-parse-benchmark

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-parse-sdk"
version = "0.7.0"
description = "Typed Python client for a self-hosted EvidenceParse API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.6,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_parse_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
